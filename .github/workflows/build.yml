name: Build

# Publishes the debian, wolfi and full images to GHCR and (when configured)
# Docker Hub. Each variant is first built for amd64, smoke-tested and scanned
# by Trivy; only an image that passes is built multi-arch and pushed by digest
# (untagged), with an SBOM and max-mode provenance. The pushed amd64 and arm64
# images are scanned again from the registry, and only then are the tags
# (latest, X.Y.Z, edge, ...) pointed at that digest. Every pushed digest is
# signed keyless with cosign. See SECURITY.md ("Verifying images").
#
# Manual runs publish edge* and are only allowed from main.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  # One publish per ref at a time. Never cancel a run that may be mid-push.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ghcr-image: ${{ steps.names.outputs.ghcr }}
      dockerhub-image: ${{ steps.names.outputs.dockerhub }}
      dockerhub-enabled: ${{ steps.dockerhub.outputs.enabled }}
      variants: ${{ steps.names.outputs.variants }}
      stable: ${{ steps.names.outputs.stable }}
    steps:
      # edge* is documented and verified as built from main; a manual run
      # from any other ref (a feature branch, or a tag ref whose identity
      # would look like a release) must not overwrite it.
      - name: Manual runs only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::manual runs publish edge images and are only allowed from refs/heads/main, not ${REF}"
          exit 1

      - name: Image names and variants
        id: names
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || github.repository }}
          RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Registries require lowercase repository names.
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=docker.io/${DOCKERHUB_IMAGE,,}" >> "$GITHUB_OUTPUT"
          # full (Playwright + Docker-in-Docker) is a release-only variant.
          if [ "$RELEASE" = "true" ]; then
            echo 'variants=["debian","wolfi","full"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["debian","wolfi"]' >> "$GITHUB_OUTPUT"
          fi
          # Only a stable vX.Y.Z tag moves latest*; a prerelease such as
          # v1.2.3-rc1 (also matched by the v*.*.* trigger) gets only its
          # version tag.
          if [ "$RELEASE" = "true" ] && [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Hub credentials present?
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set, publishing to GHCR only."
          fi

  build:
    name: Build, gate and push (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    env:
      VARIANT: ${{ matrix.variant }}
      GATE_IMAGE: mcphub:gate-${{ matrix.variant }}
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr-image }}
      DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.dockerhub-image }}
      DOCKERHUB_ENABLED: ${{ needs.prepare.outputs.dockerhub-enabled }}
      # debian is the default variant and carries the plain tags.
      SUFFIX: ${{ matrix.variant != 'debian' && format('-{0}', matrix.variant) || '' }}
      DOCKERFILE: ${{ matrix.variant == 'wolfi' && 'Dockerfile.wolfi' || 'Dockerfile' }}
      INSTALL_EXT: ${{ matrix.variant == 'full' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating package.json version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          grep -m 1 '"version"' package.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ needs.prepare.outputs.ghcr-image }}
            ${{ needs.prepare.outputs.dockerhub-enabled == 'true' && needs.prepare.outputs.dockerhub-image || '' }}
          tags: |
            type=raw,value=edge${{ env.SUFFIX }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}${{ env.SUFFIX }},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest${{ env.SUFFIX }},enable=${{ needs.prepare.outputs.stable == 'true' }}
          flavor: |
            latest=false

      # ---- Gate: nothing is pushed unless the amd64 image passes ----------

      - name: Build gate image (amd64, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.GATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            INSTALL_EXT=${{ env.INSTALL_EXT }}
            VERSION=${{ steps.meta.outputs.version }}

      # full keeps root for Docker-in-Docker by design (the entrypoint does not
      # drop privileges when dockerd is present), so the smoke test's uid 10001
      # check cannot pass on it. full is still scanned by Trivy below.
      - name: Smoke test
        if: matrix.variant != 'full'
        run: scripts/docker-smoke.sh "$GATE_IMAGE"

      - name: Trivy image scan (fail on HIGH+ with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GATE_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # ---- Publish ---------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.prepare.outputs.dockerhub-enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same context, Dockerfile, args, labels and cache as the gate build, so
      # the amd64 image is assembled from the layers that were just scanned.
      # Pushed by digest only: no tag points at it until the checks below
      # pass. `tags` here only names the repositories (no tag is pushed).
      - name: Build and push by digest (multi-arch, SBOM, provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_ENABLED == 'true' && env.DOCKERHUB_IMAGE || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            INSTALL_EXT=${{ env.INSTALL_EXT }}
            VERSION=${{ steps.meta.outputs.version }}

      # Proof that the pushed amd64 image is the one that passed the gate:
      # its layer diff IDs must equal those of the scanned image. On a
      # mismatch no tag is published and the digest is not handed to signing.
      - name: Pushed amd64 image matches the scanned image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          scanned=$(docker image inspect "$GATE_IMAGE" --format '{{json .RootFS.Layers}}' | jq -c .)
          pushed=$(docker buildx imagetools inspect "${GHCR_IMAGE}@${DIGEST}" --format '{{json .Image}}' \
            | jq -c 'if has("linux/amd64") then .["linux/amd64"] else . end | .rootfs.diff_ids')
          if [ "$scanned" != "$pushed" ]; then
            echo "::error::pushed amd64 layers differ from the scanned image"
            echo "scanned: $scanned"
            echo "pushed:  $pushed"
            exit 1
          fi
          echo "amd64 layers match the scanned image ($(jq length <<<"$scanned") layers)"

      # The arm64 image is a separate artifact (other packages and binaries,
      # see the uname -m branches in the Dockerfile), so the pushed digest is
      # scanned per platform from the registry with the same gate settings.
      - name: Trivy scan of the pushed digest (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan of the pushed digest (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_IMAGE_SRC: remote
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Promote: only now do the public tags point at the checked digest.
      # Each tag is created from the digest in its own repository and then
      # read back, so a tag can never name anything but that digest.
      - name: Publish tags
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::invalid pushed digest"
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            repo="${tag%:*}"
            docker buildx imagetools create --tag "$tag" "${repo}@${DIGEST}"
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${tag} resolves to ${got}, expected ${DIGEST}"
              exit 1
            fi
            echo "${tag} -> ${DIGEST}"
          done <<<"$TAGS"

      - name: Record digest for signing
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${VARIANT}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}
          path: digests/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign pushed digests (cosign keyless)
    needs: [prepare, build]
    # Sign every variant that was pushed, even if another variant failed.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write # store the signatures in GHCR
      id-token: write # OIDC token for the Fulcio certificate
    env:
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr-image }}
      DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.dockerhub-image }}
      DOCKERHUB_ENABLED: ${{ needs.prepare.outputs.dockerhub-enabled }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.prepare.outputs.dockerhub-enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign
        run: |
          shopt -s nullglob
          files=(digests/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no pushed digests to sign"
            exit 1
          fi
          for f in "${files[@]}"; do
            digest=$(cat "$f")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::invalid digest for ${f##*/}"
              exit 1
            fi
            echo "Signing ${f##*/} ${digest}"
            cosign sign --yes "${GHCR_IMAGE}@${digest}"
            if [ "$DOCKERHUB_ENABLED" = "true" ]; then
              cosign sign --yes "${DOCKERHUB_IMAGE}@${digest}"
            fi
          done
