version: "3.8"

services:
  # PostgreSQL database for MCPHub configuration
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mcphub-postgres
    environment:
      POSTGRES_DB: mcphub
      POSTGRES_USER: mcphub
      # Required: no well-known default. Generate one, e.g. `openssl rand -hex 24`.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (e.g. openssl rand -hex 24)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on loopback only, for local tools/dev. MCPHub reaches the
    # database over the compose network, so it never needs a public port.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcphub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcphub-network

  # MCPHub application
  mcphub:
    image: samanhappy/mcphub:latest
    container_name: mcphub
    # MCPHub runs as uid 10001. Data written by older images (which ran as
    # root) is root-owned: hand it over once, then start the stack again:
    #   docker compose -f docker-compose.db.yml run --rm --user 0:0 mcphub mcphub-migrate
    # Do not add `user: "0:0"` to keep root; see "Upgrading from root images"
    # in docs/configuration/docker-setup.mdx.
    environment:
      # Database connection (setting DB_URL automatically enables database mode)
      DB_URL: "postgresql://mcphub:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/mcphub"

      # Optional: Explicitly control database mode (overrides auto-detection)
      # USE_DB: "true"

      # Application settings
      PORT: 3000
      NODE_ENV: production

      # Optional: Custom npm registry
      # NPM_REGISTRY: https://registry.npmjs.org/

      # Optional: Proxy settings
      # HTTP_PROXY: http://proxy:8080
      # HTTPS_PROXY: http://proxy:8080
    ports:
      - "${MCPHUB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcphub-network

volumes:
  pgdata:
    driver: local

networks:
  mcphub-network:
    driver: bridge
