apiVersion: batch/v1
kind: Job
metadata:
  name: mcphub-setup
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcphub-setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: setup
          image: samanhappy/mcphub:latest
          imagePullPolicy: Always
          args: [node, dist/db/setup.js]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          envFrom:
            - configMapRef: { name: mcphub-config }
            - secretRef: { name: mcphub-secrets }
          env:
            - { name: npm_config_userconfig, value: /tmp/.npmrc }
            - { name: DB_SYNCHRONIZE, value: 'true' }
            - { name: MCPHUB_REPLICA_MODE, value: 'false' }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: mcphub-admin, key: ADMIN_PASSWORD }
          volumeMounts:
            - { name: settings, mountPath: /etc/mcphub, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /app/data }
            - { name: npm-cache, mountPath: /home/mcphub/.npm }
            - { name: uv-cache, mountPath: /home/mcphub/.cache }
      volumes:
        - name: settings
          configMap: { name: mcphub-settings }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
        - name: npm-cache
          emptyDir: { sizeLimit: 512Mi }
        - name: uv-cache
          emptyDir: { sizeLimit: 512Mi }
